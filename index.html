<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Snake Favicon." />
<meta name="theme-color" content="#ffffff" />

<title>Snake Favicon</title>

<link rel="icon" id="favicon" href="" />
<script type="module" defer src="./src/index.js"></script>

<link rel="stylesheet" href="./style/css/styles.css">
</head>

<body>

<header role="banner">
    <h1>Snake Favicon</h1>
    <details>
        <strong>Desktop:</strong> jogue pelo favicon.<br />
        <strong>Mobile:</strong> o jogo aparece abaixo.
    </details>
</header>

<main role="main" aria-label="Área do jogo">
    <canvas id="mobileView" role="img" aria-label="Tela do jogo Snake" width="64" height="64"></canvas>
    <button id="restartBtn" aria-label="Reiniciar o jogo">Reiniciar</button>
    
    <canvas id="favCanvas" class="hidden" width="64" height="64" ></canvas>
</main>

</body>
</html>
